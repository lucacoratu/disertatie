- name: Wait for the virtual machine to finish booting
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Wait for cloud-init to finish (it may still hold the apt lock)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Install the base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - rsync
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the directory for the apt keys
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the key of the Docker repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start Docker at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow the SSH user to run docker commands
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Create the project directory
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: "0755"
